<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Markdown Parser Test</title>

    <style>
        * {
            box-sizing: border-box;
            background: #0c0c0c;
            color: rgb(255 255 255 / 0.8);
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .input-container,
        .output-container {
            width: 50%;
            height: 100%;
        }

        .input-container {
            border-right: 1px solid #ddd;
        }

        #markdown-input {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            resize: none;
            padding: 20px;
            font-family: monospace;
            font-size: 14px;
        }

        .output-container {
            display: flex;
            flex-direction: column;
        }

        .output-preview {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            border-bottom: 1px solid #ddd;
        }

        .output-html {
            height: 40%;
            padding: 20px;
            overflow-y: auto;
            font-family: monospace;
            white-space: pre-wrap;
        }

        h3 {
            margin: 0;
            padding-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="input-container">
        <label for="markdown-input"></label><textarea id="markdown-input">
# Hello World

This is a paragraph.

## Shopping List

- Apples
- Bananas
- Oranges

1. First
2. Second
3. Third
        </textarea>
    </div>

    <div class="output-container">

        <div class="output-preview">
            <h3>Preview</h3>
            <div id="preview"></div>
        </div>

        <div class="output-html">
            <h3>Generated HTML</h3>
            <pre id="html-output"></pre>
        </div>

    </div>

</div>

<script type="module">

    import {parse} from "../src/index.js";

    const input = document.getElementById("markdown-input");
    const preview = document.getElementById("preview");
    const htmlOutput = document.getElementById("html-output");

    function render() {
        const markdown = input.value;

        const html = parse(markdown);

        preview.innerHTML = html;
        htmlOutput.textContent = html;
    }

    input.addEventListener("input", render);

    render();

</script>

</body>
</html>
