<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Markdown Parser Test</title>

    <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500&family=Noto+Sans+Mono:wght@100..900&family=Poppins&display=swap"
            rel="stylesheet"
    />
    <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500&family=Noto+Sans+Mono:wght@100..900&family=Poppins&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
            rel="stylesheet"
    />

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100vh;
            font-family: Arial, sans-serif;
            background: #0c0c0c;
            color: rgb(186 184 179);
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .input-container,
        .output-container {
            width: 50%;
            height: 100%;
        }

        .input-container {
            border-right: 1px solid #ddd;
            padding: 20px;
        }

        #markdown-input {
            width: 100%;
            height: 90%;
            border: none;
            outline: none;
            resize: none;
            padding: 20px;
            font-family: monospace;
            font-size: 14px;
            background-color: rgba(255 255 255 / 0.03);
            border-radius: 10px;
            color: rgb(186 184 179);
        }

        .output-container {
            display: flex;
            flex-direction: column;
        }

        .output-preview {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            border-bottom: 1px solid #ddd;
        }

        #preview {
            background-color: rgba(255 255 255 / 0.03);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

        .output-html {
            height: 40%;
            padding: 20px;
            overflow-y: auto;
            font-family: monospace;
            white-space: pre-wrap;
        }

        #html-output {
            background-color: rgba(255 255 255 / 0.03);
            border-radius: 10px;
            padding: 20px;
        }

        h3 {
            margin: 0;
            padding-bottom: 10px;
        }

        .inline-code {
            font-family: "Noto Sans Mono", monospace;
            font-size: 14px;
            background-color: rgba(255 255 255 / 0.2);
            border-radius: 6px;
            padding: 1px 8px;
            margin: 0 4px;
        }
    </style>
</head>
<body>

<div class="container">


    <div class="input-container">
        <h3>MarkDown Input</h3>
        <label for="markdown-input"></label><textarea id="markdown-input">
# Hello World

This is a paragraph.

## Shopping List

- Apples
- Bananas
- Oranges

1. First
2. Second
3. Third

Code snippets work: `print("Hello world!")`

You can use **bold** text

And also _italic_ text

Heck you can even **_`combine`_** all of them!
</textarea>
    </div>

    <div class="output-container">

        <div class="output-preview">
            <h3>Preview:</h3>
            <hr>
            <div id="preview"></div>
        </div>

        <div class="output-html">
            <h3>Generated HTML</h3>
            <pre id="html-output"></pre>
        </div>

    </div>

</div>

<script type="module">

    import {parse} from "../src/index.js";

    const input = document.getElementById("markdown-input");
    const preview = document.getElementById("preview");
    const htmlOutput = document.getElementById("html-output");

    function render() {
        const markdown = input.value;

        const html = parse(markdown);

        preview.innerHTML = html;
        htmlOutput.textContent = html;
    }

    input.addEventListener("input", render);

    render();

</script>

</body>
</html>
