<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Markdown Parser Test</title>

    <link href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" rel="stylesheet"/>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/styles/dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/highlight.min.js"></script>
    <!-- and it's easy to individually load additional languages -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/languages/go.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            scrollbar-width: thin;
        }

        :root {
            --bg: #151515;
            --text: rgb(186 184 179);
            --panel: rgba(255 255 255 / 0.03);
            --border: #444;
            --link: #0080ff;
            --inline-code: rgb(128 128 128 / 0.5);
            --header-bg: #000;
        }

        [data-theme="light"] {
            --bg: #f8f9fb;
            --text: #1f2937;
            --panel: rgba(0 0 0 / 0.05);
            --border: #d1d5db;
            --link: #0066cc;
            --inline-code: rgba(0 0 0 / 0.1);
            --header-bg: #3c3c3c;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .header {
            flex-shrink: 0;

            background-color: var(--header-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 4px 30px;
            color: #fff;
        }

        #theme-toggle {
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            transition: background 0.2s;
        }

        #theme-toggle:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .container {
            display: flex;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .input-container,
        .output-container {
            width: 50%;
            min-height: 0;
            overflow: hidden;
        }

        .input-container {
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 20px;
        }

        #markdown-input {
            flex: 1;
            min-height: 0;
            border: none;
            outline: none;
            resize: none;
            padding: 20px;
            font-family: monospace;
            font-size: 14px;
            border-radius: 10px;
            background-color: var(--panel);
            color: var(--text);
        }

        .output-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        #output-toggle {
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
            background: rgb(89 89 89 / 0.8);
            color: white;
            transition: background 0.2s;
        }

        #output-toggle:hover {
            background: rgb(89 89 89 / 0.5);
        }

        .output-preview, .output-html {
            flex: 1;
            min-width: 0;
            min-height: 0;
            overflow: auto;
        }

        .output-preview {
            display: block;
            background-color: var(--panel);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            overflow-y: auto;
        }

        .output-html {
            display: none;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            background-color: var(--panel);
            overflow-y: auto;
            font-family: monospace;
            white-space: pre-wrap;
        }

        #html-output {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        h3 {
            margin: 0;
            padding-bottom: 10px;
        }

        .buttons {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        a {
            color: white;
            text-decoration: none;
        }

        a:active {
            color: white;
        }

        .devicon-github-original {
            font-size: 1.5em;
        }

        .inmd-inline-code {
            font-family: monospace;
            font-size: 0.8rem;
            background-color: var(--inline-code);
            border-radius: 6px;
            padding: 4px 12px;
            margin: 0 4px;
        }

        .inmd-hyperlink {
            color: var(--link);
        }

        .inmd-hyperlink:active {
            color: var(--link);
        }

        .inmd-blockquote {
            margin: 1rem 0;
            padding: 0.25rem 1rem;

            border-left: 4px solid currentColor;

            color: rgba(128, 128, 128, 0.95);
            background: rgba(128, 128, 128, 0.08);
        }

        .inmd-blockquote > :first-child {
            margin-top: 0;
        }

        .inmd-blockquote > :last-child {
            margin-bottom: 0;
        }

        .inmd-blockquote .inmd-blockquote {
            margin-left: 0.5rem;
        }
    </style>
</head>
<body>

<div class="header">
    <h2>I Need Markdown – Viewer</h2>
    <div class="buttons">
        <a class="icon" href="https://github.com/Ym64/i-need-markdown" target="_blank"><i
                class="devicon-github-original"></i></a>
        <button id="theme-toggle">️☀️ Light Mode</button>
    </div>
</div>
<div class="container">
    <div class="input-container">
        <h3>Markdown Input</h3>
        <label for="markdown-input"></label><textarea id="markdown-input">
# Hello World ![test image](https://img.shields.io/badge/just%20the%20message-8A2BE2)

This is a paragraph.

---

## Shopping List

- Apples
- Bananas
- Oranges

1. First
2. Second
3. Third

Code snippets work: `print("Hello world!")`

You can als use **bold**, _italic_, ~~strike through~~ or __underline__ text!

Heck you can even **_`combine`_** all of them!

Oh yeah, [links](https://ymanu.dev) and [mails](me@ymanu.dev) work too! Even automatically: https://ymanu.dev/

Code blocks also exist:
```javascript
function gekoloniseerd() {
    console.log("Hello World!");
}
```
**Please note** that this viewer uses [highlight.js](https://highlightjs.org/) for syntax highlighting.


> ***Insert inspiring quote***
> > ***Quit... Don't quit... NOODLES***</textarea>
    </div>

    <div class="output-container">
        <div class="control-panel">
            <h3 id="output-title">Preview</h3>
            <button id="output-toggle">View HTML</button>
        </div>
        <div class="output-preview">
            <div id="preview"></div>
        </div>
        <div class="output-html"><pre id="html-output"></pre></div>

    </div>

</div>

<script type="module">

    const params = new URLSearchParams(window.location.search);

    const version = params.get("version");
    const packageUrl = version
        ? `https://esm.sh/i-need-markdown@${version}`
        : "https://esm.sh/i-need-markdown";

    const {parse} = await import(packageUrl);

    const input = document.getElementById("markdown-input");
    const preview = document.getElementById("preview");
    const htmlOutput = document.getElementById("html-output");

    function render() {
        const markdown = input.value;

        const html = parse(markdown);

        preview.innerHTML = html;
        htmlOutput.textContent = html;

        preview.querySelectorAll("pre code").forEach(codeElement => {
            hljs.highlightElement(codeElement);
        })
    }

    input.addEventListener("input", render);

    render();

    const themeButton = document.getElementById("theme-toggle");

    themeButton.addEventListener("click", () => {
        const current = document.documentElement.getAttribute("data-theme");

        if (current === "light") {
            document.documentElement.removeAttribute("data-theme"); // default to dark theme
            themeButton.textContent = "☀️ Light Mode"
        } else {
            document.documentElement.setAttribute("data-theme", "light");
            themeButton.textContent = "🌙 Dark Mode"
        }

    });

    const outputToggleButton = document.getElementById("output-toggle");
    const outputTitle = document.getElementById("output-title");
    let currentToggle = "PREVIEW";

    outputToggleButton.addEventListener("click", () => {
        if (currentToggle === "HTML") {
            document.querySelectorAll(".output-html").forEach(outputHtml => {
                outputHtml.style.display = "none";
            })

            document.querySelectorAll(".output-preview").forEach(outputHtml => {
                outputHtml.style.display = "block";
            })

            currentToggle = "PREVIEW";
            outputTitle.innerText = "Preview"
            outputToggleButton.innerText = "View HTML"
        } else {
            document.querySelectorAll(".output-html").forEach(outputHtml => {
                outputHtml.style.display = "block";
            })

            document.querySelectorAll(".output-preview").forEach(outputHtml => {
                outputHtml.style.display = "none";
            })

            currentToggle = "HTML";
            outputTitle.innerText = "HTML"
            outputToggleButton.innerText = "View MD"
        }
    });

</script>

</body>
</html>
